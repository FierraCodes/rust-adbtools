<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a65a"/>
      <stop offset="1" stop-color="#c8561f"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <!-- phone body -->
  <rect x="72" y="30" width="112" height="196" rx="22" fill="url(#rust)"/>
  <rect x="82" y="50" width="92" height="150" rx="8" fill="#14171f"/>
  <rect x="112" y="37" width="32" height="5" rx="2.5" fill="#14171f" opacity=".6"/>
  <circle cx="128" cy="213" r="5" fill="#14171f" opacity=".6"/>
  <!-- app grid -->
  <g fill="#f2a65a">
    <rect x="92" y="60" width="16" height="16" rx="4"/>
    <rect x="120" y="60" width="16" height="16" rx="4"/>
    <rect x="148" y="60" width="16" height="16" rx="4" opacity=".35"/>
    <rect x="92" y="86" width="16" height="16" rx="4" opacity=".35"/>
    <rect x="120" y="86" width="16" height="16" rx="4"/>
    <rect x="148" y="86" width="16" height="16" rx="4"/>
  </g>
  <!-- shell prompt -->
  <text x="128" y="170" font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="40" text-anchor="middle" fill="#f4f1ea">&gt;_</text>
</svg>
