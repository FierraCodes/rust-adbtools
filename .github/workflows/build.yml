name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: rusty-adb
          - os: macos-latest
            name: macos-arm64
            bin: rusty-adb
          - os: windows-latest
            name: windows-x86_64
            bin: rusty-adb.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-adb-${{ matrix.name }}
          path: target/release/${{ matrix.bin }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          cd dist
          for d in */; do n="${d%/}"; (cd "$n" && chmod +x * && zip -r "../$n.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
