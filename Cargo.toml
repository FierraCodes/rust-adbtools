[package]
name = "rusty-adb"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FierraCodes/rust-adbtools"

[dependencies]
apk-info = "1.0.13"
dirs = "7.0.0"
eframe = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.2"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
